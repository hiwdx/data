name: 📊 Update All Data

# ──────────────────────────────────────────────────────────────────────────────
# ETF 溢价 + 宏观指标 → public/*.json → commit → GitHub Pages 自动刷新
#
# 调度说明（GitHub cron 为 UTC）：
#   GitHub 在整点与半点容易出现排队甚至漏掉计划任务。所有触发点避开
#   00 / 30 分钟，仍保持每 30 分钟一次的盘中节奏：
#   BJT 09:27 / 10:02 / 10:32 / 11:02 / 11:32 /
#       13:02 / 13:32 / 14:02 / 14:32 / 15:02 / 16:17
#   实际执行前仍按 A 股交易日历判定，避免节假日 / 调休误跑。
#   实际执行前再用 A 股交易日历判定一次，避免节假日 / 调休误跑
#
# 历史问题备忘：
#   - [skip ci] 会阻止 Pages 部署 → 已移除
#   - 盘中首个更新点改到 BJT 09:30，避免开盘后仍停留在盘前数据
#   - ETF 多段复杂 cron 几乎不触发 → 保持显式半小时时点，避免 */15 模式不稳定
#   - ETF 失败会阻断 macro → update.sh 允许部分成功
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # BJT 09:27（UTC 01:27）
    - cron: '27 1 * * 1-5'
    # BJT 10:02 / 10:32 / 11:02 / 11:32（UTC 02:02 / 02:32 / 03:02 / 03:32）
    - cron: '2,32 2-3 * * 1-5'
    # BJT 13:02 / 13:32 / 14:02 / 14:32（UTC 05:02 / 05:32 / 06:02 / 06:32）
    - cron: '2,32 5-6 * * 1-5'
    # BJT 15:02（UTC 07:02）
    - cron: '2 7 * * 1-5'
    # BJT 16:17（UTC 08:17，收盘后兜底）
    - cron: '17 8 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-all:
    name: Fetch & Commit All Data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check CN Trading Day
        if: github.event_name == 'schedule'
        id: cn_trade_day
        run: |
          if python - <<'PY'
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('etf_pipeline', Path('scripts/etf_pipeline.py'))
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          raise SystemExit(0 if mod._is_cn_trade_day() else 1)
          PY
          then
            echo "is_trade_day=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_trade_day=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Non-Trading Day
        if: github.event_name == 'schedule' && steps.cn_trade_day.outputs.is_trade_day != 'true'
        run: echo 'CN market closed today, skip scheduled update.'

      - name: Fetch, commit & push
        if: github.event_name != 'schedule' || steps.cn_trade_day.outputs.is_trade_day == 'true'
        env:
          PYTHON: python
          SKIP_GIT_PULL: '1'
        run: |
          git pull --rebase origin main
          bash scripts/update.sh
