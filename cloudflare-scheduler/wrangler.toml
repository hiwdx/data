name = "hiwd-data-scheduler"
main = "src/worker.js"
compatibility_date = "2026-07-30"
account_id = "f7697893dd0fa8224c98aaf8ac92e695"

# This Worker is cron-only: it has no route, custom domain, or public website
# traffic. `workers_dev = false` prevents a workers.dev endpoint as well.
workers_dev = false

[vars]
GITHUB_REPO = "hiwdx/data"
GITHUB_WORKFLOW = "update-data.yml"
GITHUB_REF = "main"

# Cloudflare Cron uses UTC. Times below are Beijing time (UTC+8):
# 09:27 / 10:02 / 10:32 / 11:02 / 11:32 /
# 13:02 / 13:32 / 14:02 / 14:32 / 15:02 / 16:17, weekdays.
[triggers]
crons = [
  "27 1 * * 1-5",
  "2,32 2-3 * * 1-5",
  "2,32 5-6 * * 1-5",
  "2 7 * * 1-5",
  "17 8 * * 1-5"
]
